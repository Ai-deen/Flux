[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flux"
version = "1.0.0"
description = "AI-powered developer lifecycle automation — from ticket to code, automatically"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "azure-search-documents>=11.4",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.15",
    "requests>=2.31",
    "flask>=3.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.scripts]
flux = "engmemory.cli:main"
flux-setup = "engmemory.setup:main"
flux-agent = "engmemory.agent.watcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engmemory*"]